services:
  - type: web
    name: campusmate-ai
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: SCHEDULER_ENABLED
        value: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_TIMETABLE_TEMPLATE
        sync: false
      - key: WHATSAPP_TIMETABLE_UPDATE_TEMPLATE
        sync: false
      - key: WHATSAPP_ASSIGNMENT_TEMPLATE
        sync: false
      - key: WHATSAPP_EXAM_TEMPLATE
        sync: false
      - key: WHATSAPP_EVENT_TEMPLATE
        sync: false
      - key: WHATSAPP_NOTIFICATION_TEMPLATE
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
